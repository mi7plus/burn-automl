[package]
name = "automl-core"
description = "Framework-agnostic optimization engine for burn-automl: search spaces, trials, samplers, pruners, storage, and studies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

# Render the SQLite backend in the docs.rs build.
[package.metadata.docs.rs]
features = ["sqlite"]

[features]
# Off by default: the SQLite backend compiles a bundled C library, which plain
# in-memory HPO users should not have to build (extraction trigger #1, §21.1).
sqlite = ["dep:rusqlite"]
# The PostgreSQL backend (§18.4) for a shared distributed store. Off by default;
# integration tests need a live server (set TEST_POSTGRES_URL) and are skipped
# otherwise.
postgres = ["dep:postgres"]

[dependencies]
rand.workspace = true
rand_chacha.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
rusqlite = { workspace = true, optional = true }
postgres = { version = "0.19", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[[bench]]
name = "samplers"
harness = false
