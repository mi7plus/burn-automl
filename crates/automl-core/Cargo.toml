[package]
name = "automl-core"
description = "Framework-agnostic optimization engine for burn-automl: search spaces, trials, samplers, pruners, storage, and studies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[features]
# Off by default: the SQLite backend compiles a bundled C library, which plain
# in-memory HPO users should not have to build (extraction trigger #1, §21.1).
sqlite = ["dep:rusqlite"]

[dependencies]
rand.workspace = true
rand_chacha.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
