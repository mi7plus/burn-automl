[package]
name = "automl-core"
description = "Framework-agnostic optimization engine for burn-automl: search spaces, trials, samplers, pruners, storage, and studies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

# Render the SQLite backend in the docs.rs build.
[package.metadata.docs.rs]
features = ["sqlite"]

[features]
# Off by default: the SQLite backend compiles a bundled C library, which plain
# in-memory HPO users should not have to build (extraction trigger #1, §21.1).
sqlite = ["dep:rusqlite"]
# The PostgreSQL backend (§18.4) lives in its own excluded crate,
# `automl-postgres`, so its `postgres` client dependency does not burden this
# crate's build (keeping the workspace buildable in vendored/restricted
# registries). See automl-postgres/ at the repo root.

[dependencies]
rand.workspace = true
rand_chacha.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
rusqlite = { workspace = true, optional = true }

# The criterion benchmark and proptest property tests live in the excluded
# `dev-suite` crate (see the root Cargo.toml), so their dev-dependencies do not
# burden the main resolution graph.
