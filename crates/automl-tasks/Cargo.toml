[package]
name = "automl-tasks"
description = "Framework-agnostic task adapters for burn-automl (classical, no deep-learning dependency): clustering, anomaly detection, reinforcement learning, and pipeline search."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
automl-core = { path = "../automl-core" }
rand.workspace = true
rand_chacha.workspace = true

[dev-dependencies]
# The end-to-end story test persists/resumes a study, so it needs the SQLite
# backend regardless of the top-level feature flags.
automl-core = { path = "../automl-core", features = ["sqlite"] }
