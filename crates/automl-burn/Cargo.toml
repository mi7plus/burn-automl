[package]
name = "automl-burn"
description = "Burn deep-learning execution adapter for burn-automl: train Burn models as automl-core objectives with intermediate reporting and pruning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[features]
# GPU execution (§18 device-aware execution). Each swaps `TrainBackend` to an
# autodiff-over-accelerator backend with no code changes, so every Auto* adapter
# runs on the device. All are off by default so the standard build stays CPU-only
# and dependency-light. Enable **at most one** — they define the same alias.
# Each needs its platform's toolchain to run and is not exercised in CI:
#   wgpu  — cross-platform (Vulkan/Metal/DX12), the portable default GPU path
#   cuda  — NVIDIA GPUs (needs the CUDA toolkit)
#   metal — Apple GPUs (needs macOS)
wgpu = ["burn/wgpu"]
cuda = ["burn/cuda"]
metal = ["burn/metal"]

[dependencies]
automl-core = { workspace = true }
burn.workspace = true
rand.workspace = true
rand_chacha.workspace = true
