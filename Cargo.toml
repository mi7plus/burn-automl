[workspace]
resolver = "2"
members = [
    "crates/automl-core",
    "crates/automl-tasks",
    "crates/automl-burn",
    "crates/automl-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/GeorgeOlteanu/burn-automl"
authors = ["George Olteanu"]

[workspace.dependencies]
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
# Burn is pinned to a stable minor; the CPU-only ndarray backend keeps the
# build free of system/GPU dependencies (§27 "Burn API evolution": thin adapter).
burn = { version = "0.21", default-features = false, features = [
    "std",
    "ndarray",
    "autodiff",
    "dataset",
    "vision",
] }

[profile.release]
lto = "thin"
