[workspace]
resolver = "2"
members = [
    "crates/automl-core",
    "crates/automl-tasks",
    "crates/automl-burn",
    "crates/automl-cli",
]

[workspace.package]
version = "1.4.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/mi7plus/burn-automl"
homepage = "https://github.com/mi7plus/burn-automl"
authors = ["George Olteanu"]
keywords = ["automl", "hyperparameter", "optimization", "machine-learning", "burn"]
categories = ["science", "algorithms", "mathematics"]

[workspace.dependencies]
# The engine crate, referenced by the others with both a path (for local builds)
# and a version (required by `cargo publish`). Bump in lockstep with the
# workspace version.
automl-core = { path = "crates/automl-core", version = "1.4.0" }
# rand is deliberately held at 0.8 (not 0.9/0.10). Burn 0.21 depends on rand 0.8
# regardless of what we declare, so upgrading would not shrink the dependency
# tree — and rand's range-sampling algorithm changed after 0.8, which would alter
# our seeded RNG output and break the load-bearing determinism guarantee. Revisit
# when Burn moves to a newer rand (they can then be aligned in one step).
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
# Burn is pinned to a stable minor; the CPU-only ndarray backend keeps the
# build free of system/GPU dependencies (§27 "Burn API evolution": thin adapter).
burn = { version = "0.21", default-features = false, features = [
    "std",
    "ndarray",
    "autodiff",
    "dataset",
    "vision",
] }

[profile.release]
lto = "thin"
