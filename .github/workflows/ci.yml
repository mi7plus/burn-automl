name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test & lint (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable, with rustfmt & clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (all targets, sqlite)
        run: cargo clippy --all-targets --features sqlite -- -D warnings
      - name: Test (workspace, sqlite + slow model-training tests)
        run: cargo test --workspace --features sqlite,slow-tests
      - name: Benchmarks compile
        run: cargo bench -p automl-core --no-run

  msrv:
    name: MSRV (1.98.0) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Build (workspace, sqlite) on the pinned MSRV
        run: cargo build --workspace --features sqlite

  docs:
    name: doc build
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs (deny warnings)
        run: cargo doc --workspace --no-deps --features sqlite

  gpu-backends:
    name: GPU backend compile-check (wgpu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # wgpu compiles without a GPU present, so this guards the accelerator path
      # against bit-rot even on a CPU runner. cuda/metal need their toolchains
      # and are left to their platforms.
      - name: Check automl-burn with the wgpu backend
        run: cargo check -p automl-burn --features wgpu
